<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Product preview card component</title>
</head>

<body>
  <main>
    <article class="card">
      <picture class="card__picture">
        <source media="(min-width:44em )" srcset="/images/image-product-desktop.jpg">
        <img src="/images/image-product-mobile.jpg" alt="Photo of the 'Gabrielle Essence Eau De Parfum'">
      </picture>
      <div class="card__product-info">
        <p class="card__category">Perfume</p>
        <h1 class="card__title">Gabrielle Essence Eau De Parfum</h1>
        <p class="card__description">A floral, solar and voluptuous interpretation composed by Olivier
          Polge,
          Perfumer-Creator for the House of CHANEL.</p>
        <div class="card__price-group">
          <p class="card__price--new">$149.99</p>
          <s class="card__price--old">$169.99</s>
        </div>
        <button class="card__button" type="button">Add to Cart</button>

      </div>
    </article>
  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="https://github.com/JohnnyCage1337">JohnnyCage1337</a>.
  </footer>
</body>

</html>
